[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,--export-dynamic", "-C", "target-cpu=x86-64-v3", "-Z", "plt=yes", "-Z", "relax-elf-relocations=yes"]

[env]
# Needed for C-variadic C-API functions (PyArg_ParseTuple, Py_BuildValue, PyErr_Format, ...);
# see DECISIONS.md D18.
RUSTC_BOOTSTRAP = "1"
